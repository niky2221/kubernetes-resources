kind: Service
apiVersion: v1
metadata: 
  name: headless-service
  labels:
    name: statefulset
    app: nginx
spec:
  ports:
  - port: 80
    name: web
  clusterIp: None
  selector:
    app: nginx
---
kind: StatefulSet
apiVersion: apps/v1
metadata: 
  name: nginx
spec:
  serviceName: headless-service
  selector:
    matchLabels:
      name: statefulset
      app: nginx
  replicas: 3
  minReadySeconds: 10
  template:
    metadata: 
      labels:
        name: statefulset
        app: nginx
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: nginx
        image: registry.k8s.io/nginx-slim:0.24
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 1Gi

      



