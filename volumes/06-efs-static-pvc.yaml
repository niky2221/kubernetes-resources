kind: PersistentVolumeClaim
apiVersion: v1
metadata: 
  name: efs-static-claim
spec:
  storageClassName: ""
  volumeName: efs-static
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
kind: Pod
apiVersion: v1
metadata:
  name: nginx
  labels:
    purpose: efs-test
    project: expense
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: efs-static
---
kind: Service
apiVersion: v1
metadata:
  name: nginx-service
spec:
  type: LoadBalancer
  selector:
     purpose: efs-test
     project: expense
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007