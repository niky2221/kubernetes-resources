kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: ebs-static-pvclaim
spec:
  storageClassName: ""
  volumeName: ebs-static-pv
  accessModes: 
  - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
---
kind: Pod
apiVersion: v1
metadata:
  name: nginx-pv
  labels:
    purpose: pvc-test
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1a
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-static-pvclaim
---
kind: Service
apiVersion: v1
metadata:
  name: nginx-service
spec:
  type: LoadBalancer
  selector:
      purpose: pvc-test
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007
