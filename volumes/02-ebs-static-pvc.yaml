kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: ebs-static-pvclaim
  labels:
    purpose: pvc-test
spec:
  storageClassName: ""
  volumeName: ebs-static-pv
  accessModes: 
  - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
---
kind: pod
apiVersion: v1
metadata:
  name: nginx-pv
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountpath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    PersistentVolumeClaim:
      claimName: ebs-static-pvclaim
---
kind: Service
apiVersion: v1
metadata:
  name: nginx-service
spec:
  type: NodePort
  selectors:
    labels:
      purpose: pvc-test
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007
