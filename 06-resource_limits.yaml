kind: Pod
apiVersion: v1
metadata:
  name: resource-limits
spec:
  containers:
  - name: nginx
    image: nginx
  - name: almalinux
    image: almalinux
    command: ["sleep", "1000"]
    resources:
      requests:
        memory: 68Mi
        cpu: 120m
      limits:
        memory: 128Mi
        cpu: 150m
