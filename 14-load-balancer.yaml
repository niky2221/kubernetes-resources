kind: Service
apiVersion: v1
metadata:
  name: service-loadbalance
spec: 
  type: LoadBalancer
  selector: # labels are used as selectors
    Project: expense 
    Component: backend
    environment: dev
    demo: lb
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30007
---
kind: Pod
apiVersion: v1
metadata:
  name: backend-lb
  labels:
    Project: expense
    Component: backend
    environment: dev
    demo: lb
spec:
  containers: 
  - name: nginx
    image: nginx
  


