apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: serviceaccount-secrets
rules:
- apiGroups: [""] # "" indicates the core API group
  resources: ["*"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
# This role binding allows "jane" to read pods in the "default" namespace.
# You need to already have a Role named "pod-reader" in that namespace.
kind: RoleBinding
metadata:
  name: serviceaccount-secrets 
  namespace: default
subjects:
# You can specify more than one "subject"
- kind: serviceAccount
  name: expense-secret-serviceaccount # "name" is case sensitive
  namespace: default
roleRef:
  # "roleRef" specifies the binding to a Role / ClusterRole
  kind: Role #this must be Role or ClusterRole
  name: serviceaccount-secrets # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: rbac.authorization.k8s.io
---
kind: Pod
apiVersion: v1
metadata: 
  name: pod-secret-sa
  labels:
    purpose: service-account
spec:
  serviceAccount: expense-secret-serviceaccount
  initContainers:
  - name: awscli      # we need aws cli image for interact with aws account, we need secrets from aws, so we need image of aws
    image: amazon/aws-cli:2.42.4
    command: ['sh', '-c', 'aws secretsmanager get-secret-value --secret-id expense/Secret/Mysql --query SecretString --output text > /secrets/.env '] # search in google - aws get value secret command   
    volumeMounts:
    - mountPath: /secrets 
      name: secret-volume
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - mountPath: /secrets 
      name: secret-volume
  volumes:
  - name: secret-volume
    emptyDir: {}


    # emptyDir :-- pod temporary storage, accessible until pod lives, all containers in the pod can access init container stores the secret in emptyDir and completes. then main container can access that secrets.
